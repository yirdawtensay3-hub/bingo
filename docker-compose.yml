version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bingo-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Add DB and JWT envs here or use an env_file:
      # - MONGODB_URI=mongodb://mongo:27017/bingo
      # - JWT_SECRET=changeme
    ports:
      - "3000:3000"
    restart: unless-stopped
    # If you need live reload during dev, mount sources and override command
    # volumes:
    #   - ./backend:/app
    # command: sh -c "npm install && npm run start:dev"
